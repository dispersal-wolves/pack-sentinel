services:
  pack-sentinel:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:7331:7331"
    volumes:
      - pack-sentinel-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  pack-sentinel-data:
